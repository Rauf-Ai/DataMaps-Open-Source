{% extends "base.html" %}
{% block content %}
  <h2 style="margin:0 0 8px;font-size:22px;">Оплата прошла успешно</h2>
  <table cellpadding="0" cellspacing="0" width="100%" style="margin:16px 0;border:1px solid #eee;border-radius:8px;">
    <tr><td style="padding:12px 16px;border-bottom:1px solid #eee;">
      <span style="color:#888;font-size:13px;">Пакет</span><br>
      <b style="font-size:15px;">{{ package_name }}</b>
    </td></tr>
    <tr><td style="padding:12px 16px;border-bottom:1px solid #eee;">
      <span style="color:#888;font-size:13px;">Сумма</span><br>
      <b style="font-size:15px;">{{ "%.2f"|format(amount_rub) }} ₽</b>
    </td></tr>
    <tr><td style="padding:12px 16px;">
      <span style="color:#888;font-size:13px;">Зачислено</span><br>
      <b style="font-size:15px;color:#FF8C00;">{{ credits }} кредитов</b>
    </td></tr>
  </table>
  <table cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr><td>
    <a href="{{ app_url }}/dashboard" target="_blank" style="display:inline-block;padding:12px 28px;background-color:#FF8C00;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">Перейти в кабинет</a>
  </td></tr></table>
{% endblock %}
