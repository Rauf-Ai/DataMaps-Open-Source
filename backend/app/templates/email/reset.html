{% extends "base.html" %}
{% block content %}
  <h2 style="margin:0 0 8px;font-size:22px;">Восстановление пароля</h2>
  <p style="font-size:15px;line-height:1.5;color:#555;">Вы запросили сброс пароля. Если это были не вы — проигнорируйте письмо.</p>
  <table cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr><td>
    <a href="{{ reset_url }}" target="_blank" style="display:inline-block;padding:12px 28px;background-color:#FF8C00;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">Задать новый пароль</a>
  </td></tr></table>
  <p style="color:#888;font-size:13px;line-height:1.5;">Если кнопка не работает:<br><a href="{{ reset_url }}" target="_blank" style="color:#FF8C00;word-break:break-all;">{{ reset_url }}</a></p>
  <p style="color:#aaa;font-size:12px;">Ссылка действует 1 час.</p>
{% endblock %}
