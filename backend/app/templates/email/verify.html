{% extends "base.html" %}
{% block content %}
  <h2 style="margin:0 0 8px;font-size:22px;">Подтверждение регистрации</h2>
  <p style="font-size:15px;line-height:1.5;color:#555;">Спасибо за регистрацию в DataMaps. Подтвердите email, чтобы получить <b style="color:#1a1a1a;">20 бесплатных кредитов</b>.</p>
  <table cellpadding="0" cellspacing="0" style="margin:24px 0;"><tr><td>
    <a href="{{ verify_url }}" target="_blank" style="display:inline-block;padding:12px 28px;background-color:#FF8C00;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;border-radius:8px;">Подтвердить email</a>
  </td></tr></table>
  <p style="color:#888;font-size:13px;line-height:1.5;">Если кнопка не работает:<br><a href="{{ verify_url }}" target="_blank" style="color:#FF8C00;word-break:break-all;">{{ verify_url }}</a></p>
  <p style="color:#aaa;font-size:12px;">Ссылка действует 24 часа.</p>
{% endblock %}
